name: Release Please

on:
  push:
    branches:
      - master

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      major: ${{ steps.release.outputs.major }}
      minor: ${{ steps.release.outputs.minor }}
      patch: ${{ steps.release.outputs.patch }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release-type: simple

  build-and-release:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' || needs.release-please.outputs.release_created == true }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Sign APK
        id: sign_apk
        uses: ilharp/sign-android-release@v2
        with:
          releaseDir: app/build/outputs/apk/release
          signingKey: ${{ secrets.SIGNING_KEYSTORE }}
          keyStorePassword: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          keyAlias: ${{ secrets.SIGNING_KEY_ALIAS }}
          keyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}

      - name: Rename APK with version
        run: |
          mv ${{ steps.sign_apk.outputs.signedFile }} nekoyume-${{ needs.release-please.outputs.version }}.apk

      - name: Upload Release Asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ needs.release-please.outputs.tag_name }} nekoyume-${{ needs.release-please.outputs.version }}.apk --clobber

      - name: VirusTotal Scan
        if: env.VT_API_KEY != ''
        id: vt
        uses: crazy-max/ghaction-virustotal@v5
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        with:
          vt_api_key: ${{ secrets.VT_API_KEY }}
          files: |
            nekoyume-${{ needs.release-please.outputs.version }}.apk

      - name: Update Release Body with Scan Results
        if: env.VT_API_KEY != '' && steps.vt.outputs.analysis != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        run: |
          TAG="${{ needs.release-please.outputs.tag_name }}"
          CURRENT_BODY=$(gh release view "$TAG" --json body --jq .body)
          VT_LINK="${{ steps.vt.outputs.analysis }}"
          VT_URL=$(echo "$VT_LINK" | cut -d'=' -f2-)
          NEW_BODY=$(printf "%s\n\n## Security Scan\n* [VirusTotal Analysis](%s)\n" "$CURRENT_BODY" "$VT_URL")
          gh release edit "$TAG" --notes "$NEW_BODY"
