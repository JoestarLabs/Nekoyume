name: "Manual Release Build"

permissions:
  contents: write
  packages: write
  statuses: read

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g., v1.0.0)"
        required: true
        type: string

env:
  APP_NAME: nekoyume

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set env
        run: echo "RELEASE_VERSION=${{ github.event.inputs.tag }}" >> $GITHUB_ENV

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew assembleRelease

      - name: Sign APK
        id: sign_apk
        uses: ilharp/sign-android-release@v2
        with:
          releaseDir: app/build/outputs/apk/release
          signingKey: ${{ secrets.SIGNING_KEYSTORE }}
          keyStorePassword: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          keyAlias: ${{ secrets.SIGNING_KEY_ALIAS }}
          keyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}

      - name: Add version to APK
        run: mv ${{ steps.sign_apk.outputs.signedFile }} ${{ env.APP_NAME }}-release-${{ env.RELEASE_VERSION }}.apk

      - name: Publish release APK
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ env.RELEASE_VERSION }}" "${{ env.APP_NAME }}-release-${{ env.RELEASE_VERSION }}.apk" --clobber || \
          gh release create "${{ env.RELEASE_VERSION }}" "${{ env.APP_NAME }}-release-${{ env.RELEASE_VERSION }}.apk" \
            --title "Nekoyume ${{ env.RELEASE_VERSION }}" \
            --generate-notes

      - name: VirusTotal Scan
        if: env.VT_API_KEY != ''
        id: vt
        uses: crazy-max/ghaction-virustotal@v5
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        with:
          vt_api_key: ${{ secrets.VT_API_KEY }}
          files: |
            ${{ env.APP_NAME }}-release-${{ env.RELEASE_VERSION }}.apk

      - name: Update Release Body with Scan Results
        if: env.VT_API_KEY != '' && steps.vt.outputs.analysis != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        run: |
          TAG="${{ env.RELEASE_VERSION }}"
          CURRENT_BODY=$(gh release view "$TAG" --json body --jq .body)
          VT_LINK="${{ steps.vt.outputs.analysis }}"
          VT_URL=$(echo "$VT_LINK" | cut -d'=' -f2-)
          NEW_BODY=$(printf "%s\n\n## Security Scan\n* [VirusTotal Analysis](%s)\n" "$CURRENT_BODY" "$VT_URL")
          gh release edit "$TAG" --notes "$NEW_BODY"
